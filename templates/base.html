{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MajedLearn{% endblock %}</title>

  <!-- 🖋️ الخط الرسمي + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- ✅ Tailwind -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  <!-- 🎨 ملفات CSS المخصصة -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">

  <!-- 🧩 مكونات الصفحة -->
</head>

<body class="bg-white text-gray-800 font-[Tajawal] leading-relaxed">

  <!-- ✅ شريط التنقل -->
  {% include 'core/navbar.html' %}

  <!-- ✅ الهيدر العلوي -->
  {% include 'core/header.html' %}

  <!-- ✅ رسائل النظام -->
  {% if messages %}
  <ul class="max-w-3xl mx-auto mt-4 text-center">
    {% for message in messages %}
    <li class="mb-2 p-2 rounded {{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <!-- ✅ محتوى الصفحة -->
  <main class="page-content max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- ✅ الفوتر -->
  {% include 'core/footer.html' %}

</body>

</html>
