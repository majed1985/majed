{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MajedLearn{% endblock %}</title>

  <!-- 🖋️ الخط الرسمي + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- ✅ Tailwind -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  <!-- 🎨 ملفات CSS المخصصة -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">

  <!-- 🧩 مكونات الصفحة -->
</head>

<body class="bg-gray-100 text-gray-800 font-[Tajawal] leading-relaxed">

  <!-- ✅ شريط التنقل -->
  {% include 'core/navbar.html' %}

  <!-- ✅ الهيدر العلوي -->
  {% include 'core/header.html' %}

  <!-- ✅ رسائل النظام -->
  {% if messages %}
  <div class="max-w-lg mx-auto mt-6">
    {% for message in messages %}
    <div class="mb-4 px-4 py-2 rounded-md shadow {{ message.tags }}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- ✅ محتوى الصفحة -->
  <main class="{% block main_class %}page-content max-w-7xl mx-auto px-4 py-6{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <!-- ✅ الفوتر -->
  {% include 'core/footer.html' %}

</body>

</html>
