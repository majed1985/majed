{% extends 'base.html' %}

{% block title %}تم التسجيل بنجاح | MajedLearn{% endblock %}

{% block content %}
<div class="relative min-h-[70vh] flex items-center justify-center overflow-hidden px-4">
  <div class="absolute w-64 h-64 bg-gradient-to-br from-green-100 to-blue-100 rounded-full -top-16 -end-16 -z-10 blur-2xl"></div>
  <div class="absolute w-72 h-72 bg-gradient-to-br from-blue-100 to-green-100 rounded-full bottom-0 start-0 -z-10 blur-2xl"></div>

  <div class="max-w-md bg-white/90 backdrop-blur border border-green-500 shadow-xl rounded-2xl p-8 text-center animate-card">
    <div class="w-24 h-24 mx-auto mb-6 flex items-center justify-center rounded-full bg-green-100 text-green-600 animate-bounce">
      <i class="fa-solid fa-circle-check text-5xl"></i>
    </div>
    <h2 class="text-4xl font-extrabold text-green-600 mb-4">تم التسجيل بنجاح</h2>
    <p class="text-lg text-gray-700 mb-2">أرسلنا رسالة تفعيل إلى بريدك الإلكتروني.</p>
    <p class="text-lg text-gray-700 mb-6">الرجاء اتباع التعليمات لتفعيل الحساب.</p>
    <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow text-lg">
      <i class="fa-solid fa-arrow-right-from-bracket fa-flip-horizontal"></i>
      العودة للرئيسية
    </a>
  </div>
</div>

<style>
  @keyframes card-in {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-card {
    animation: card-in 0.7s ease-out forwards;
  }
</style>
{% endblock %}
