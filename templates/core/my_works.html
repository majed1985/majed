{% extends "base.html" %}

{% block main_class %}page-content w-full px-2 py-6{% endblock %}

{% block title %}أعمالي | MajedLearn{% endblock %}

{% block content %}
<div class="works-container">
  <div class="works-grid">
    <div class="work-card">
      <div class="work-icon"><i class="fas fa-tools"></i></div>
      <div class="work-name">التدريب الفني على رأس العمل</div>
    </div>
    <div class="work-card">
      <div class="work-icon"><i class="fas fa-laptop"></i></div>
      <div class="work-name">الدورات التدريبية - أون لاين</div>
    </div>
    <a href="{% url 'core:upload_employees' %}" class="work-card">
      <div class="work-icon"><i class="fas fa-check-circle"></i></div>
      <div class="work-name">تقييم الإستقدام الحديث</div>
    </a>
    <div class="work-card">
      <div class="work-icon"><i class="fas fa-handshake"></i></div>
      <div class="work-name">التدريب التعاوني</div>
    </div>
  </div>
</div>

<style>
.works-container {
  width: 100%;
  margin: 0;
  padding: 20px 0 30px;
  background: #fff;
  border-radius: 18px;
}

.works-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 32px;
  justify-items: center;
}

.work-card {
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 4px 18px #08347d16;
  width: 100%;
  padding: 36px 18px 26px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: box-shadow 0.18s, transform 0.18s;
  text-decoration: none;
}

.work-card:hover {
  box-shadow: 0 10px 28px #00cc0033;
  transform: translateY(-3px) scale(1.03);
  background: linear-gradient(120deg, #e6f6ea 60%, #f5f5ff 100%);
}

.work-icon {
  background: #002366;
  color: #fff;
  border-radius: 50%;
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  margin-bottom: 18px;
  box-shadow: 0 2px 10px #08347d33;
}

.work-name {
  font-size: 1.15rem;
  font-weight: bold;
  color: #002366;
  margin-top: 8px;
  text-align: center;
}

@media (max-width: 900px) {
  .works-grid { grid-template-columns: 1fr 1fr; gap: 18px; }
}
@media (max-width: 600px) {
  .works-grid { grid-template-columns: 1fr; gap: 14px; }
}
</style>
{% endblock %}
