{% load static %}

<!-- ✅ HERO SECTION -->
<section class="hero">
  <div class="hero-container">

    <!-- ✅ العنوان -->
    <div class="hero-content">
      <h2 class="hero-subtitle">مرحبًا بك في منصة إدارة التعلم والتطوير</h2>
      <h1 class="hero-title">تعلّم الآن، وكن قائدًا للمستقبل</h1>
    </div>

    <!-- ✅ الأزرار -->
    <div class="hero-actions">
      {% if not request.user.is_authenticated %}
        <a href="{% url 'core:register' %}" class="btn btn-primary" aria-label="تسجيل حساب جديد">
          <i class="fa-solid fa-user-plus"></i>
          تسجيل جديد
        </a>

        <a href="{% url 'core:login' %}" class="btn btn-secondary" aria-label="تسجيل الدخول">
          <i class="fa-solid fa-right-to-bracket"></i>
          تسجيل دخول
        </a>
      {% else %}
        <form action="{% url 'core:logout' %}" method="post" style="display: inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-secondary no-custom-font" aria-label="تسجيل الخروج">
            <i class="fa-solid fa-right-from-bracket"></i>
            تسجيل خروج
          </button>
        </form>
      {% endif %}
    </div>

</div>
</section>
