{% extends "base.html" %}

{% block title %}تأكيد كلمة المرور الجديدة{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white border border-gray-200 rounded-xl shadow p-8 text-center">

  <!-- عنوان الصفحة -->
  <h2 class="text-2xl font-bold text-green-700 mb-4">🔒 تعيين كلمة مرور جديدة</h2>

  <!-- النموذج -->
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit"
      class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
      💾 حفظ كلمة المرور الجديدة
    </button>
  </form>

</div>
{% endblock %}
